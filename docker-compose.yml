name: webbuilder-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # PostgreSQL and Redis run on the host. Host networking lets the container reach them
    # with the same localhost URLs as `npm run dev`, and the API listens on the host's PORT.
    network_mode: host
    environment:
      NODE_ENV: ${NODE_ENV:-production}
